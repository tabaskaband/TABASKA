<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
}
</style>
</head>

<body>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==================================================
   ライト演出 設定
   ================================================== */


/* ---------- 通常の演出 ---------- */

// 色が変わる間隔
// 100 = 0.1秒
const EFFECT_INTERVAL = 100;

// 色が変わる瞬間の滑らかさ
// 0  = 一瞬で切り替え
// 20 = 0.02秒かけて変化
// 100 = 0.1秒かけて変化
const EFFECT_TRANSITION = 20;


/* ---------- フラッシュ ---------- */

// 白 ↔ ランダムカラーの切り替え間隔
// 300 = 0.3秒
const FLASH_INTERVAL = 300;

// 色が変わる瞬間の滑らかさ
// 0  = 一瞬で切り替え
// 20 = 0.02秒かけて変化
// 100 = 0.1秒かけて変化
const FLASH_TRANSITION = 10;


/* ==================================================
   Socket.IO
   ================================================== */

const socket = io("https://tabaska.onrender.com");


/* ==================================================
   状態
   ================================================== */

let flashing = false;
let flashTimer = null;
let showWhite = false;


/* ==================================================
   色変更
   ================================================== */

function changeColor(color, transitionTime) {

  document.body.style.transition =
    `background ${transitionTime}ms linear`;

  document.body.style.background = color;
}


/* ==================================================
   接続確認
   ================================================== */

socket.on("connect", () => {
  console.log("light connected:", socket.id);
});


/* ==================================================
   通常色・演出
   ================================================== */

socket.on("colorUpdate", (color) => {

  // フラッシュ中は通常の演出を無視
  if (flashing) return;

  changeColor(color, EFFECT_TRANSITION);

});


/* ==================================================
   ランダムカラー
   ================================================== */

function getRandomColor() {

  const r = Math.floor(Math.random() * 256);
  const g = Math.floor(Math.random() * 256);
  const b = Math.floor(Math.random() * 256);

  return `rgb(${r}, ${g}, ${b})`;

}


/* ==================================================
   ⚡ フラッシュ開始
   ================================================== */

socket.on("flash", () => {

  if (flashing) return;

  flashing = true;
  showWhite = false;

  runFlashLoop();

});


/* ==================================================
   🔁 フラッシュ
   ================================================== */

function runFlashLoop() {

  if (!flashing) return;


  if (showWhite) {

    // 白
    changeColor("#ffffff", FLASH_TRANSITION);

  } else {

    // ランダムカラー
    changeColor(
      getRandomColor(),
      FLASH_TRANSITION
    );

  }


  showWhite = !showWhite;


  flashTimer = setTimeout(
    runFlashLoop,
    FLASH_INTERVAL
  );

}


/* ==================================================
   🛑 フラッシュ停止
   ================================================== */

socket.on("stopFlash", () => {

  flashing = false;
  showWhite = false;


  if (flashTimer) {

    clearTimeout(flashTimer);
    flashTimer = null;

  }


  // 黒へ戻す
  changeColor("#000000", FLASH_TRANSITION);

});

</script>

</body>
</html>
