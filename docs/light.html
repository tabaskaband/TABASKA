<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light</title>

<style>
body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  background: black;
  overflow: hidden;
}
</style>

</head>
<body>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* =========================
   通常演出
========================= */

const EFFECT_DISPLAY = 250;
const EFFECT_TRANSITION = 100;

/* =========================
   フラッシュ
========================= */

const FLASH_DISPLAY = 150;
const FLASH_WHITE_DISPLAY = 30;
const FLASH_TRANSITION = 7;

/* =========================
   Socket.IO
========================= */

const socket = io(
  "https://tabaska.onrender.com",
  {
    transports: ["websocket"],
    reconnection: true,
    reconnectionAttempts: Infinity
  }
);

/* =========================
   状態
========================= */

let flashing = false;
let effectTimer = null;
let flashTimer = null;

/* =========================
   色変更
========================= */

function changeColor(color, transitionTime) {

  document.body.style.transition =
    `background ${transitionTime}ms linear`;

  document.body.style.background =
    color;

}

/* =========================
   ランダム色
========================= */

function getRandomColor() {

  const r = Math.floor(Math.random() * 256);
  const g = Math.floor(Math.random() * 256);
  const b = Math.floor(Math.random() * 256);

  return `rgb(${r}, ${g}, ${b})`;

}

/* =========================
   接続確認
========================= */

socket.on("connect", () => {

  console.log(
    "light connected:",
    socket.id
  );

});

socket.on("disconnect", () => {

  console.log(
    "light disconnected"
  );

});

/* =========================
   色変更
========================= */

socket.on("colorUpdate", (color) => {

  console.log(
    "colorUpdate:",
    color
  );

  if (flashing) return;

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  changeColor(
    color,
    EFFECT_TRANSITION
  );

});

/* =========================
   演出ループ
========================= */

function runEffectLoop() {

  if (flashing) return;

  const color =
    getRandomColor();

  changeColor(
    color,
    EFFECT_TRANSITION
  );

  effectTimer = setTimeout(() => {

    if (!flashing) {

      runEffectLoop();

    }

  },
  EFFECT_DISPLAY +
  EFFECT_TRANSITION);

}

/* =========================
   演出開始
========================= */

socket.on("effect", () => {

  console.log(
    "effect received"
  );

  flashing = false;

  if (effectTimer) {

    clearTimeout(effectTimer);

  }

  runEffectLoop();

});

/* =========================
   演出停止
========================= */

socket.on("stopEffect", () => {

  console.log(
    "stopEffect received"
  );

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  changeColor(
    "#000000",
    EFFECT_TRANSITION
  );

});

/* =========================
   フラッシュ開始
========================= */

socket.on("flash", () => {

  console.log(
    "flash received"
  );

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  flashing = true;

  runFlashLoop();

});

/* =========================
   フラッシュループ
========================= */

function runFlashLoop() {

  if (!flashing) return;

  changeColor(
    getRandomColor(),
    FLASH_TRANSITION
  );

  flashTimer = setTimeout(() => {

    if (!flashing) return;

    changeColor(
      "#ffffff",
      FLASH_TRANSITION
    );

    flashTimer = setTimeout(() => {

      if (!flashing) return;

      runFlashLoop();

    },
    FLASH_WHITE_DISPLAY +
    FLASH_TRANSITION);

  },
  FLASH_DISPLAY +
  FLASH_TRANSITION);

}

/* =========================
   フラッシュ停止
========================= */

socket.on("stopFlash", () => {

  console.log(
    "stopFlash received"
  );

  flashing = false;

  if (flashTimer) {

    clearTimeout(flashTimer);
    flashTimer = null;

  }

  changeColor(
    "#000000",
    FLASH_TRANSITION
  );

});

</script>

</body>
</html>
