<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
}
</style>
</head>

<body>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==================================================
   ライト演出 設定
   ================================================== */


/* ==================================================
   通常の演出
   ================================================== */

// 1色を表示する時間
// 500 = 0.5秒
const EFFECT_DISPLAY = 500;

// 次の色へ変化する時間
// 0 = 一瞬で切り替え
// 50 = 0.05秒かけて変化
const EFFECT_TRANSITION = 50;


/* ==================================================
   フラッシュ
   ================================================== */

// 1色を表示する時間
// 300 = 0.3秒
const FLASH_DISPLAY = 300;

// 次の色へ変化する時間
// 0 = 一瞬で切り替え
// 10 = 0.01秒かけて変化
const FLASH_TRANSITION = 10;


/* ==================================================
   Socket.IO
   ================================================== */

const socket = io("https://tabaska.onrender.com");


/* ==================================================
   状態
   ================================================== */

let flashing = false;

let effectTimer = null;
let flashTimer = null;


/* ==================================================
   色を変更
   ================================================== */

function changeColor(color, transitionTime) {

  document.body.style.transition =
    `background ${transitionTime}ms linear`;

  document.body.style.background = color;

}


/* ==================================================
   ランダムカラー
   ================================================== */

function getRandomColor() {

  const r = Math.floor(Math.random() * 256);
  const g = Math.floor(Math.random() * 256);
  const b = Math.floor(Math.random() * 256);

  return `rgb(${r}, ${g}, ${b})`;

}


/* ==================================================
   接続確認
   ================================================== */

socket.on("connect", () => {

  console.log(
    "light connected:",
    socket.id
  );

});


/* ==================================================
   🎨 演出スタート
   ================================================== */

socket.on("colorUpdate", (color) => {

  // フラッシュ中は通常演出を無視
  if (flashing) return;

  // サーバーから送られた色を表示
  changeColor(
    color,
    EFFECT_TRANSITION
  );

});


/* ==================================================
   🎨 ランダムカラー演出
   ================================================== */

function runEffectLoop() {

  if (flashing) return;


  // ランダムカラーを表示
  changeColor(
    getRandomColor(),
    EFFECT_TRANSITION
  );


  // 指定時間表示した後、次の色へ
  effectTimer = setTimeout(
    runEffectLoop,
    EFFECT_DISPLAY
  );

}


/* ==================================================
   🎬 演出開始
   ==================================================

   サーバーから "effect" が来た場合
   ランダムカラー演出を開始
   ================================================== */

socket.on("effect", () => {

  if (flashing) return;

  if (effectTimer) {
    clearTimeout(effectTimer);
  }

  runEffectLoop();

});


/* ==================================================
   ⚡ フラッシュ開始
   ================================================== */

socket.on("flash", () => {

  // 演出を停止
  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }


  if (flashing) return;

  flashing = true;

  runFlashLoop();

});


/* ==================================================
   ⚡ フラッシュ
   ================================================== */

function runFlashLoop() {

  if (!flashing) return;


  // ランダムカラー
  changeColor(
    getRandomColor(),
    FLASH_TRANSITION
  );


  flashTimer = setTimeout(() => {

    if (!flashing) return;


    // 白
    changeColor(
      "#ffffff",
      FLASH_TRANSITION
    );


    flashTimer = setTimeout(
      runFlashLoop,
      FLASH_DISPLAY
    );

  }, FLASH_DISPLAY);

}


/* ==================================================
   🛑 フラッシュ停止
   ================================================== */

socket.on("stopFlash", () => {

  flashing = false;


  if (flashTimer) {

    clearTimeout(flashTimer);
    flashTimer = null;

  }


  changeColor(
    "#000000",
    FLASH_TRANSITION
  );

});


/* ==================================================
   🛑 演出停止
   ================================================== */

socket.on("stopEffect", () => {

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }


  if (!flashing) {

    changeColor(
      "#000000",
      EFFECT_TRANSITION
    );

  }

});

</script>

</body>
</html>
