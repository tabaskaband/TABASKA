<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin: 0;
  height: 100vh;
  background: black;
}

</style>
</head>

<body>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==================================================
   ライト演出 設定
   ================================================== */


/* ==================================================
   🎨 通常の演出
   ================================================== */

const EFFECT_DISPLAY = 250;
const EFFECT_TRANSITION = 100;


/* ==================================================
   ⚡ フラッシュ
   ================================================== */

const FLASH_DISPLAY = 150;
const FLASH_WHITE_DISPLAY = 30;
const FLASH_TRANSITION = 7;


/* ==================================================
   Socket.IO
   ================================================== */

const socket = io(
  "https://tabaska.onrender.com",
  {
    transports: ["websocket"]
  }
);


/* ==================================================
   状態
   ================================================== */

let flashing = false;

let effectTimer = null;
let flashTimer = null;


/* ==================================================
   色を変更
   ================================================== */

function changeColor(color, transitionTime) {

  document.body.style.transition =
    `background ${transitionTime}ms linear`;

  document.body.style.background = color;

}


/* ==================================================
   ランダムカラー
   ================================================== */

function getRandomColor() {

  const r = Math.floor(Math.random() * 256);
  const g = Math.floor(Math.random() * 256);
  const b = Math.floor(Math.random() * 256);

  return `rgb(${r}, ${g}, ${b})`;

}


/* ==================================================
   接続確認
   ================================================== */

socket.on("connect", () => {

  console.log(
    "light connected:",
    socket.id
  );

});

socket.on("disconnect", () => {

  console.log(
    "light disconnected"
  );

});


/* ==================================================
   🎨 通常の色変更
   ================================================== */

socket.on("colorUpdate", (color) => {

  if (flashing) return;

  // 演出中なら停止して手動色を優先
  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  changeColor(
    color,
    EFFECT_TRANSITION
  );

});


/* ==================================================
   🎨 ランダムカラー演出
   ================================================== */

function runEffectLoop() {

  if (flashing) return;

  const color = getRandomColor();

  changeColor(
    color,
    EFFECT_TRANSITION
  );

  effectTimer = setTimeout(() => {

    if (flashing) return;

    runEffectLoop();

  }, EFFECT_TRANSITION + EFFECT_DISPLAY);

}


/* ==================================================
   🎬 演出スタート
   ================================================== */

socket.on("effect", () => {

  if (flashing) return;

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  runEffectLoop();

});


/* ==================================================
   ⚡ フラッシュ開始
   ================================================== */

socket.on("flash", () => {

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  if (flashing) return;

  flashing = true;

  runFlashLoop();

});


/* ==================================================
   ⚡ フラッシュ
   ================================================== */

function runFlashLoop() {

  if (!flashing) return;

  changeColor(
    getRandomColor(),
    FLASH_TRANSITION
  );

  flashTimer = setTimeout(() => {

    if (!flashing) return;

    changeColor(
      "#ffffff",
      FLASH_TRANSITION
    );

    flashTimer = setTimeout(() => {

      if (!flashing) return;

      runFlashLoop();

    }, FLASH_TRANSITION + FLASH_WHITE_DISPLAY);

  }, FLASH_TRANSITION + FLASH_DISPLAY);

}


/* ==================================================
   🛑 フラッシュ停止
   ================================================== */

socket.on("stopFlash", () => {

  flashing = false;

  if (flashTimer) {

    clearTimeout(flashTimer);
    flashTimer = null;

  }

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  changeColor(
    "#000000",
    FLASH_TRANSITION
  );

});


/* ==================================================
   🛑 演出停止
   ================================================== */

socket.on("stopEffect", () => {

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }

  if (!flashing) {

    changeColor(
      "#000000",
      EFFECT_TRANSITION
    );

  }

});

</script>

</body>
</html>
