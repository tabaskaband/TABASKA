<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin: 0;
  height: 100vh;
  background: black;
}

</style>
</head>

<body>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==================================================
   ライト演出 設定
   ================================================== */


/* ==================================================
   🎨 通常の演出
   ================================================== */

// 1色を表示しておく時間
// 1000 = 1秒
const EFFECT_DISPLAY = 250;

// 次の色へ変化する時間
// 0 = 一瞬で切り替え
// 50 = 0.05秒かけて変化
const EFFECT_TRANSITION = 100;


/* ==================================================
   ⚡ フラッシュ
   ================================================== */

// ランダムカラーを表示しておく時間
// 1000 = 1秒
const FLASH_DISPLAY = 100;

// 白を表示しておく時間
// 1000 = 1秒
const FLASH_WHITE_DISPLAY = 20;

// 色が変化する時間
// 0 = 一瞬で切り替え
// 10 = 0.01秒かけて変化
const FLASH_TRANSITION = 0;


/* ==================================================
   Socket.IO
   ================================================== */

const socket = io("https://tabaska.onrender.com");


/* ==================================================
   状態
   ================================================== */

let flashing = false;

let effectTimer = null;
let flashTimer = null;


/* ==================================================
   色を変更
   ================================================== */

function changeColor(color, transitionTime) {

  document.body.style.transition =
    `background ${transitionTime}ms linear`;

  document.body.style.background = color;

}


/* ==================================================
   ランダムカラー
   ================================================== */

function getRandomColor() {

  const r = Math.floor(Math.random() * 256);
  const g = Math.floor(Math.random() * 256);
  const b = Math.floor(Math.random() * 256);

  return `rgb(${r}, ${g}, ${b})`;

}


/* ==================================================
   接続確認
   ================================================== */

socket.on("connect", () => {

  console.log(
    "light connected:",
    socket.id
  );

});


/* ==================================================
   🎨 通常の色変更
   ================================================== */

socket.on("colorUpdate", (color) => {

  // フラッシュ中は無視
  if (flashing) return;

  changeColor(
    color,
    EFFECT_TRANSITION
  );

});


/* ==================================================
   🎨 ランダムカラー演出
   ================================================== */

function runEffectLoop() {

  if (flashing) return;


  // 新しいランダムカラー
  const color = getRandomColor();


  // 色を変更
  changeColor(
    color,
    EFFECT_TRANSITION
  );


  /*
   * 色の変化が終わってから
   * 指定した時間だけ表示
   */

  effectTimer = setTimeout(() => {

    if (flashing) return;

    runEffectLoop();

  }, EFFECT_TRANSITION + EFFECT_DISPLAY);

}


/* ==================================================
   🎬 演出スタート
   ================================================== */

socket.on("effect", () => {

  if (flashing) return;


  // 既存のタイマーを停止
  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }


  // ランダムカラー演出開始
  runEffectLoop();

});


/* ==================================================
   ⚡ フラッシュ開始
   ================================================== */

socket.on("flash", () => {

  // 通常演出を停止
  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }


  if (flashing) return;

  flashing = true;

  runFlashLoop();

});


/* ==================================================
   ⚡ フラッシュ
   ================================================== */

function runFlashLoop() {

  if (!flashing) return;


  /*
   * ------------------------------------------
   * ランダムカラー
   * ------------------------------------------
   */

  changeColor(
    getRandomColor(),
    FLASH_TRANSITION
  );


  /*
   * 色の変化が終わった後、
   * ランダムカラーを表示する
   */

  flashTimer = setTimeout(() => {

    if (!flashing) return;


    /*
     * ------------------------------------------
     * 白
     * ------------------------------------------
     */

    changeColor(
      "#ffffff",
      FLASH_TRANSITION
    );


    /*
     * 白への変化が終わった後、
     * 指定時間だけ白を表示
     */

    flashTimer = setTimeout(() => {

      if (!flashing) return;

      runFlashLoop();

    }, FLASH_TRANSITION + FLASH_WHITE_DISPLAY);


  }, FLASH_TRANSITION + FLASH_DISPLAY);

}


/* ==================================================
   🛑 フラッシュ停止
   ================================================== */

socket.on("stopFlash", () => {

  flashing = false;


  if (flashTimer) {

    clearTimeout(flashTimer);
    flashTimer = null;

  }


  changeColor(
    "#000000",
    FLASH_TRANSITION
  );

});


/* ==================================================
   🛑 演出停止
   ================================================== */

socket.on("stopEffect", () => {

  if (effectTimer) {

    clearTimeout(effectTimer);
    effectTimer = null;

  }


  if (!flashing) {

    changeColor(
      "#000000",
      EFFECT_TRANSITION
    );

  }

});


</script>

</body>
</html>
