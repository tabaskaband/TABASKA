<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TABASKA Control</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  text-align: center;
  background: #111;
  color: #fff;
}

h1 {
  margin-bottom: 20px;
}

#colorPicker {
  width: 80%;
  max-width: 400px;
  height: 60px;
  cursor: pointer;
}

.buttons {
  margin-top: 20px;
}

button {
  padding: 15px 20px;
  margin: 5px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: #fff;
  cursor: pointer;
}

button:hover {
  background: #555;
}

#status {
  margin-top: 20px;
  font-size: 14px;
  color: #00ff88;
}

</style>

</head>

<body>

<h1>🎛 TABASKA Control</h1>

<!-- =========================
     カラーピッカー
========================= -->

<input
type="color"
id="colorPicker"
value="#ffffff"

>

<!-- =========================
     色ボタン
========================= -->

<div class="buttons">

  <button id="redButton">
    🔴 赤
  </button>

  <button id="orangeButton">
    🟠 オレンジ
  </button>

  <button id="yellowButton">
    🟡 黄
  </button>

  <button id="greenButton">
    🟢 緑
  </button>

  <button id="blueButton">
    🔵 青
  </button>

  <button id="whiteButton">
    ⚪ 白
  </button>

  <button id="blackButton">
    ⚫ 黒
  </button>

</div>

<!-- =========================
     ランダム演出
========================= -->

<div class="buttons">

  <button id="startEffectButton">
    ▶ ランダム演出開始
  </button>

  <button id="stopEffectButton">
    ■ ランダム演出停止
  </button>

</div>

<!-- =========================
     フラッシュ
========================= -->

<div class="buttons">

  <button id="startFlashButton">
    ⚡ フラッシュ開始
  </button>

  <button id="stopFlashButton">
    ■ フラッシュ停止
  </button>

</div>

<!-- =========================
     ステータス
========================= -->

<div id="status">
  接続待機中...
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==================================================
   DOM
================================================== */

const statusEl =
  document.getElementById("status");

const colorPicker =
  document.getElementById("colorPicker");


/* ==================================================
   Socket.IO
================================================== */

console.log(
  "TABASKA CONTROL SCRIPT START"
);


const socket = io(
  "https://tabaska.onrender.com",
  {
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
  }
);


/* ==================================================
   接続
================================================== */

socket.on("connect", () => {

  console.log(
    "================================="
  );

  console.log(
    "TABASKA CONTROL CONNECTED"
  );

  console.log(
    "socket.id:",
    socket.id
  );

  console.log(
    "================================="
  );

  statusEl.textContent =
    "✅ 接続中";

});


/* ==================================================
   接続エラー
================================================== */

socket.on("connect_error", (error) => {

  console.error(
    "CONTROL CONNECT ERROR:",
    error
  );

  statusEl.textContent =
    "❌ 接続エラー";

});


/* ==================================================
   切断
================================================== */

socket.on("disconnect", (reason) => {

  console.log(
    "CONTROL DISCONNECTED:",
    reason
  );

  statusEl.textContent =
    "❌ 切断";

});


/* ==================================================
   色変更
================================================== */

function setColor(color) {

  console.log(
    "CONTROL COLOR:",
    color
  );

  colorPicker.value =
    color;

  socket.emit(
    "changeColor",
    color
  );

}


/* ==================================================
   色ボタン
================================================== */

document
  .getElementById("redButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: RED"
    );

    setColor("#ff0000");

  });


document
  .getElementById("orangeButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: ORANGE"
    );

    setColor("#ffa500");

  });


document
  .getElementById("yellowButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: YELLOW"
    );

    setColor("#ffff00");

  });


document
  .getElementById("greenButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: GREEN"
    );

    setColor("#00ff00");

  });


document
  .getElementById("blueButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: BLUE"
    );

    setColor("#0000ff");

  });


document
  .getElementById("whiteButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: WHITE"
    );

    setColor("#ffffff");

  });


document
  .getElementById("blackButton")
  .addEventListener("click", () => {

    console.log(
      "BUTTON CLICK: BLACK"
    );

    setColor("#000000");

  });


/* ==================================================
   カラーピッカー
================================================== */

colorPicker.addEventListener(
  "input",
  (event) => {

    console.log(
      "COLOR PICKER:",
      event.target.value
    );

    setColor(
      event.target.value
    );

  }
);


/* ==================================================
   ランダム演出開始
================================================== */

document
  .getElementById("startEffectButton")
  .addEventListener("click", () => {

    console.log(
      "================================="
    );

    console.log(
      "BUTTON CLICK: START EFFECT"
    );

    console.log(
      "socket.connected:",
      socket.connected
    );

    console.log(
      "socket.id:",
      socket.id
    );

    console.log(
      ">>> CONTROL: effect送信"
    );

    console.log(
      "================================="
    );


    socket.emit(
      "effect"
    );

  });


/* ==================================================
   ランダム演出停止
================================================== */

document
  .getElementById("stopEffectButton")
  .addEventListener("click", () => {

    console.log(
      "================================="
    );

    console.log(
      "BUTTON CLICK: STOP EFFECT"
    );

    console.log(
      "socket.connected:",
      socket.connected
    );

    console.log(
      ">>> CONTROL: stopEffect送信"
    );

    console.log(
      "================================="
    );


    socket.emit(
      "stopEffect"
    );

  });


/* ==================================================
   フラッシュ開始
================================================== */

document
  .getElementById("startFlashButton")
  .addEventListener("click", () => {

    console.log(
      "================================="
    );

    console.log(
      "BUTTON CLICK: START FLASH"
    );

    console.log(
      "socket.connected:",
      socket.connected
    );

    console.log(
      ">>> CONTROL: flash送信"
    );

    console.log(
      "================================="
    );


    socket.emit(
      "flash"
    );

  });


/* ==================================================
   フラッシュ停止
================================================== */

document
  .getElementById("stopFlashButton")
  .addEventListener("click", () => {

    console.log(
      "================================="
    );

    console.log(
      "BUTTON CLICK: STOP FLASH"
    );

    console.log(
      "socket.connected:",
      socket.connected
    );

    console.log(
      ">>> CONTROL: stopFlash送信"
    );

    console.log(
      "================================="
    );


    socket.emit(
      "stopFlash"
    );

  });


/* ==================================================
   初期化完了
================================================== */

console.log(
  "TABASKA CONTROL READY"
);

</script>

</body>
</html>
