
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TABASKA Control</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  text-align: center;
  background: #111;
  color: white;
}

h1 {
  margin-bottom: 20px;
}

#colorPicker {
  width: 80%;
  max-width: 400px;
  height: 60px;
  cursor: pointer;
}

.buttons {
  margin-top: 20px;
}

button {
  padding: 15px 20px;
  margin: 5px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #555;
}

#status {
  margin-top: 20px;
  color: #00ff88;
}

</style>
</head>

<body>

<h1>🎛 TABASKA Control</h1>

<input
  type="color"
  id="colorPicker"
  value="#ffffff"
>

<div class="buttons">
  <button onclick="setColor('#ff0000')">🔴 赤</button>
  <button onclick="setColor('#ffa500')">🟠 オレンジ</button>
  <button onclick="setColor('#ffff00')">🟡 黄</button>
  <button onclick="setColor('#00ff00')">🟢 緑</button>
  <button onclick="setColor('#0000ff')">🔵 青</button>
  <button onclick="setColor('#ffffff')">⚪ 白</button>
  <button onclick="setColor('#000000')">⚫ 黒</button>
</div>

<div class="buttons">
  <button onclick="startEffect()">
    ▶ ランダム演出開始
  </button>

  <button onclick="stopEffect()">
    ■ ランダム演出停止
  </button>
</div>

<div class="buttons">
  <button onclick="startFlash()">
    ⚡ フラッシュ開始
  </button>

  <button onclick="stopFlash()">
    ■ フラッシュ停止
  </button>
</div>

<div id="status">
接続中...
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* =========================
   Socket.IO
========================= */

const socket = io(
  "https://tabaska.onrender.com",
  {
    transports: ["websocket"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
  }
);

const statusEl =
  document.getElementById("status");


/* =========================
   接続確認
========================= */

socket.on("connect", () => {

  console.log(
    "connected:",
    socket.id
  );

  statusEl.textContent =
    "✅ 接続中";

});

socket.on("disconnect", () => {

  console.log(
    "disconnected"
  );

  statusEl.textContent =
    "❌ 切断";

});


/* =========================
   色変更
========================= */

function setColor(color) {

  console.log(
    "changeColor:",
    color
  );

  document.getElementById(
    "colorPicker"
  ).value = color;

  socket.emit(
    "changeColor",
    color
  );

}


/* カラーピッカー */

document
  .getElementById("colorPicker")
  .addEventListener(
    "input",
    (e) => {

      setColor(
        e.target.value
      );

    }
  );


/* =========================
   ランダム演出
========================= */

function startEffect() {

  console.log(
    "effect"
  );

  socket.emit(
    "effect"
  );

}

function stopEffect() {

  console.log(
    "stopEffect"
  );

  socket.emit(
    "stopEffect"
  );

}


/* =========================
   フラッシュ
========================= */

function startFlash() {

  console.log(
    "flash"
  );

  socket.emit(
    "flash"
  );

}

function stopFlash() {

  console.log(
    "stopFlash"
  );

  socket.emit(
    "stopFlash"
  );

}

</script>

</body>
</html>
