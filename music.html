<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TABASKA Live</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #050b16;
      color: #ffffff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==============================
       Header
    ============================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 11, 22, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .logo span {
      color: #4da3ff;
    }

    .header-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      text-align: right;
    }

    /* ==============================
       Main
    ============================== */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 45px;
    }

    .hero-label {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 14px;
      border: 1px solid rgba(77,163,255,0.45);
      border-radius: 999px;
      color: #4da3ff;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .hero p {
      margin: 14px 0 0;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
    }

    /* ==============================
       Concert Info
    ============================== */

    .concert-info {
      max-width: 760px;
      margin: 0 auto 45px;
      padding: 25px;
      border-radius: 18px;
      background: linear-gradient(
        145deg,
        rgba(20,35,60,0.95),
        rgba(8,16,30,0.95)
      );
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .concert-title {
      text-align: center;
      margin-bottom: 22px;
    }

    .concert-title h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
    }

    .concert-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .detail {
      padding: 15px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      text-align: center;
    }

    .detail-label {
      display: block;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.45);
      font-size: 11px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 500;
    }

    /* ==============================
       SNS
    ============================== */

    .sns {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0 50px;
    }

    .sns a {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.25s ease;
    }

    .sns a:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.12);
    }

    /* ==============================
       Song List
    ============================== */

    #song-list {
      width: 100%;
    }

    .stage-section {
      margin-bottom: 50px;
    }

    .stage-title {
      margin: 0 0 20px;
      padding: 13px 18px;
      border-left: 4px solid #268cff;
      background: linear-gradient(
        90deg,
        rgba(38,140,255,0.15),
        transparent
      );
      color: #4da3ff;
      font-size: 20px;
      font-weight: 600;
    }

    .stage-2 .stage-title {
      border-left-color: #f97316;
      background: linear-gradient(
        90deg,
        rgba(249,115,22,0.15),
        transparent
      );
      color: #f97316;
    }

    .song-card {
      margin-bottom: 12px;
      padding: 18px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      transition: 0.25s ease;
    }

    .song-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.055);
    }

    .song-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
    }

    .song-artist {
      margin-top: 3px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
    }

    .lyrics-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 11px;
      border-radius: 7px;
      background: rgba(77,163,255,0.12);
      color: #70b5ff;
      font-size: 12px;
      transition: 0.2s ease;
    }

    .lyrics-link:hover {
      background: rgba(77,163,255,0.22);
    }

    .stage-2 .lyrics-link {
      background: rgba(249,115,22,0.12);
      color: #fb923c;
    }

    .stage-2 .lyrics-link:hover {
      background: rgba(249,115,22,0.22);
    }

    /* ==============================
       Medley
    ============================== */

    .medley-list {
      margin-top: 10px;
      padding-left: 14px;
      border-left: 2px solid rgba(255,255,255,0.08);
    }

    .medley-item {
      padding: 7px 0;
    }

    .medley-item-title {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255,255,255,0.86);
    }

    .medley-link {
      display: inline-block;
      margin-top: 3px;
      color: #70b5ff;
      font-size: 11px;
    }

    .stage-2 .medley-link {
      color: #fb923c;
    }

    /* ==============================
       Preparing / unpublished
    ============================== */

    .preparing-message {
      margin: 40px auto;
      padding: 50px 25px;
      max-width: 650px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      line-height: 1.8;
    }

    .preparing-message span {
      display: block;
      margin-top: 8px;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
    }

    /* ==============================
       Footer
    ============================== */

    footer {
      padding: 30px 20px;
      border-top: 1px solid rgba(255,255,255,0.07);
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
    }

    /* ==============================
       Mobile
    ============================== */

    @media (max-width: 700px) {

      .header-inner {
        padding: 15px;
      }

      .logo {
        font-size: 20px;
      }

      .header-subtitle {
        font-size: 10px;
      }

      main {
        padding: 35px 14px 60px;
      }

      .concert-details {
        grid-template-columns: 1fr;
      }

      .concert-info {
        padding: 20px 15px;
      }

      .stage-title {
        font-size: 18px;
      }

      .song-card {
        padding: 15px;
      }

      .song-title {
        font-size: 16px;
      }

      .medley-item-title {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- ==============================
       Header
  ============================== -->

  <header>
    <div class="header-inner">
      <div class="logo">
        TABA<span>SKA</span>
      </div>

      <div class="header-subtitle">
        Music Performance Band
      </div>
    </div>
  </header>


  <!-- ==============================
       Main
  ============================== -->

  <main>

    <section class="hero">
      <div class="hero-label">TABASKA LIVE</div>

      <h1 id="concert-title">
        TABASKA Live
      </h1>

      <p>
        Live Performance &amp; Lyrics
      </p>
    </section>


    <!-- ==============================
         Concert Information
    ============================== -->

    <section class="concert-info">

      <div class="concert-title">
        <h2 id="concert-name"></h2>
      </div>

      <div class="concert-details">

        <div class="detail">
          <span class="detail-label">DATE</span>
          <span class="detail-value" id="concert-date"></span>
        </div>

        <div class="detail">
          <span class="detail-label">VENUE</span>
          <span class="detail-value" id="concert-venue"></span>
        </div>

        <div class="detail">
          <span class="detail-label">STAGE</span>
          <span class="detail-value">
            <span id="stage1-time"></span>
            /
            <span id="stage2-time"></span>
          </span>
        </div>

      </div>

    </section>


    <!-- ==============================
         SNS
    ============================== -->

    <div class="sns">

      <a
        href="https://www.instagram.com/tabaska_official/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a
        href="https://www.youtube.com/@tabaska2025"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
      >
        <i class="fa-brands fa-youtube"></i>
      </a>

      <a
        href="https://x.com/TABASKA_official"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X"
      >
        <i class="fa-brands fa-x-twitter"></i>
      </a>

    </div>


    <!-- ==============================
         Song List
    ============================== -->

    <div id="song-list"></div>

  </main>


  <!-- ==============================
       Footer
  ============================== -->

  <footer>
    &copy; TABASKA
  </footer>


  <!-- ==============================
       Songs Data
  ============================== -->

  <script src="songs.js?v=20261002-03"></script>


  <!-- ==============================
       Main JavaScript
  ============================== -->

  <script>

    /* --------------------------------
       コンサート情報
    -------------------------------- */

    if (typeof concertTitle !== "undefined") {
      document.getElementById("concert-title").textContent = concertTitle;
      document.getElementById("concert-name").textContent = concertTitle;
    }

    if (typeof concertDate !== "undefined") {
      document.getElementById("concert-date").textContent = concertDate;
    }

    if (typeof concertVenue !== "undefined") {
      document.getElementById("concert-venue").textContent = concertVenue;
    }

    if (typeof stage1Time !== "undefined") {
      document.getElementById("stage1-time").textContent =
        "Stage 1 " + stage1Time;
    }

    if (typeof stage2Time !== "undefined") {
      document.getElementById("stage2-time").textContent =
        "Stage 2 " + stage2Time;
    }


    /* --------------------------------
       歌詞公開期間
       
       2026年10月1日 15:00
       ～
       2026年10月4日 19:00
    -------------------------------- */

    const now = new Date();

    const fromDate = new Date(
      "2026-10-01T15:00:00+09:00"
    );

    const untilDate = new Date(
      "2026-10-04T19:00:00+09:00"
    );

    const lyricsAvailable =
      now >= fromDate &&
      now < untilDate;


    /* --------------------------------
       曲目表示
    -------------------------------- */

    const songList = document.getElementById("song-list");


    /*
     * 公開期間外
     */
    if (!lyricsAvailable) {

      songList.innerHTML = `
        <div class="preparing-message">
          現在、未公開です
          <span>
            イベント開催時間中のみご覧いただけます。
          </span>
        </div>
      `;

    }


    /*
     * 公開期間内
     */
    else {

      if (
        typeof songs !== "undefined" &&
        Array.isArray(songs) &&
        songs.length > 0
      ) {

        /*
         * STAGE 1 / STAGE 2 に分ける
         */

        const stages = {};

        songs.forEach(song => {

          if (!stages[song.stage]) {
            stages[song.stage] = [];
          }

          stages[song.stage].push(song);

        });


        /*
         * 曲目HTMLを作成
         */

        let html = "";


        Object.keys(stages).forEach(stage => {

          const isStage2 =
            stage.toUpperCase() === "STAGE 2";

          html += `
            <section class="stage-section ${isStage2 ? "stage-2" : ""}">

              <h2 class="stage-title">
                ${stage}
              </h2>
          `;


          stages[stage].forEach(song => {

            html += `
              <div class="song-card">

                <div class="song-title">
                  ${song.title}
                </div>
            `;


            /*
             * メドレーではない曲
             */

            if (
              !song.medley ||
              !Array.isArray(song.medley) ||
              song.medley.length === 0
            ) {

              /*
               * 歌手名
               */

              if (
                song.artist &&
                String(song.artist).trim() !== ""
              ) {

                html += `
                  <div class="song-artist">
                    ${song.artist}
                  </div>
                `;

              }


              /*
               * 歌詞リンク
               */

              if (
                song.lyrics &&
                String(song.lyrics).trim() !== ""
              ) {

                html += `
                  <a
                    href="${song.lyrics}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="lyrics-link"
                  >
                    <i class="fa-solid fa-music"></i>
                    歌詞を見る
                  </a>
                `;

              }

            }


            /*
             * メドレー
             */

            else {

              html += `
                <div class="medley-list">
              `;


              song.medley.forEach(item => {

                html += `
                  <div class="medley-item">

                    <div class="medley-item-title">
                      ・${item.title}
                    </div>
                `;


                /*
                 * メドレー内の歌詞リンク
                 */

                if (
                  item.lyrics &&
                  String(item.lyrics).trim() !== ""
                ) {

                  html += `
                    <a
                      href="${item.lyrics}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="medley-link"
                    >
                      歌詞を見る
                    </a>
                  `;

                }


                html += `
                  </div>
                `;

              });


              html += `
                </div>
              `;

            }


            html += `
              </div>
            `;

          });


          html += `
            </section>
          `;

        });


        songList.innerHTML = html;

      }


      /*
       * songs.js が読み込めていない
       * または songs が空の場合
       */

      else {

        songList.innerHTML = `
          <div class="preparing-message">
            現在準備中です
            <span>
              公開までしばらくお待ちください。
            </span>
          </div>
        `;

      }

    }

  </script>

</body>
</html>
