<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABASKA Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #020617;
      color: #f1f5f9;
    }
    header {
      min-height: 40vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 4rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #38bdf8; }
      to { text-shadow: 0 0 30px #0ea5e9; }
    }
    .subtitle {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }
    .concert-info {
      margin-top: 30px;
      text-align: center;
    }
    .concert-date {
      margin-bottom: 8px;
      color: #38bdf8;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .concert-title {
      margin-bottom: 6px;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .concert-venue {
      margin-bottom: 4px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .concert-time {
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    section {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    h2 {
      margin: 0 0 25px;
      padding-left: 12px;
      border-left: 5px solid #38bdf8;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .stage-title {
      margin: 35px 0 15px;
      padding: 10px 14px;
      border-left: 4px solid #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border-radius: 6px;
      color: #e0f2fe;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .stage-title:first-child { margin-top: 0; }
    .song-list {
      display: grid;
      gap: 15px;
    }
    .song-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 20px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      transition: 0.25s ease;
    }
    .song-card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .song-info {
      min-width: 0;
      flex: 1;
    }
    .song-title {
      margin-bottom: 5px;
      color: #38bdf8;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .song-artist {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .song-link {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 15px;
      color: #ffffff;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.25s ease;
    }
    .song-link:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    footer {
      padding: 30px 20px;
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
    }
    @media (max-width: 600px) {
      header { min-height: 35vh; padding: 35px 15px; }
      header h1 { font-size: 2.6rem; }
      .concert-info { margin-top: 25px; }
      .concert-date { font-size: 1rem; }
      .concert-title { font-size: 1.05rem; }
      .concert-venue, .concert-time { font-size: 0.85rem; }
      section { padding: 30px 15px 50px; }
      h2 { font-size: 1.3rem; margin-bottom: 20px; }
      .stage-title { font-size: 1.05rem; margin-top: 28px; }
      .song-card { padding: 16px; gap: 12px; }
      .song-title { font-size: 1rem; }
      .song-artist { font-size: 0.8rem; }
      .song-link { padding: 9px 11px; font-size: 0.8rem; }
    }
    @media (max-width: 380px) {
      .song-link span { display: none; }
      .song-link { width: 38px; height: 38px; padding: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TABASKA</h1>
    <div class="subtitle"></div>
    <div class="concert-info">
      <div id="concert-date" class="concert-date"></div>
      <div id="concert-title" class="concert-title"></div>
      <div id="concert-venue" class="concert-venue"></div>
      <div id="concert-time" class="concert-time"></div>
    </div>
  </header>

  <section>
    <h2>曲一覧</h2>
    <div id="song-list" class="song-list"></div>
  </section>

  <footer>TABASKA</footer>

  <script src="songs.js"></script>
  <script>
    document.getElementById("concert-date").textContent = concertDate;
    document.getElementById("concert-title").textContent = concertTitle;
    document.getElementById("concert-venue").textContent = concertVenue;
    document.getElementById("concert-time").textContent = "開演 " + concertTime;

    const songList = document.getElementById("song-list");

    if (typeof songs !== "undefined" && Array.isArray(songs)) {
      let currentStage = "";

      songs.forEach(song => {
        // ステージが変わったら見出しを表示
        if (song.stage && song.stage !== currentStage) {
          currentStage = song.stage;

          const stageTitle = document.createElement("div");
          stageTitle.className = "stage-title";
          stageTitle.textContent = currentStage;
          songList.appendChild(stageTitle);
        }

        const card = document.createElement("div");
        card.className = "song-card";

        // 歌詞URLがある曲だけ「歌詞を見る」を表示
        const lyricsButton = song.lyrics
          ? `
            <a
              href="${song.lyrics}"
              target="_blank"
              rel="noopener noreferrer"
              class="song-link"
            >
              <i class="fa-solid fa-music"></i>
              <span>歌詞を見る</span>
            </a>
          `
          : "";

        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist || ""}</div>
          </div>
          ${lyricsButton}
        `;

        songList.appendChild(card);
      });
    } else {
      songList.innerHTML = `
        <div style="padding:20px;background:#0f172a;border-radius:12px;color:#94a3b8;">
          曲データを読み込めませんでした。
        </div>
      `;
    }
  </script>
</body>
</html>
